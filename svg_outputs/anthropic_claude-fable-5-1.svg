<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Sky background -->
  <rect width="400" height="300" fill="#cfeeff"/>
  <!-- Ground -->
  <rect y="240" width="400" height="60" fill="#8fbf6a"/>
  <line x1="0" y1="242" x2="400" y2="242" stroke="#6e9a4e" stroke-width="3"/>

  <!-- Bicycle -->
  <g stroke="#333" stroke-width="5" fill="none" stroke-linecap="round">
    <!-- Wheels -->
    <circle cx="110" cy="210" r="38"/>
    <circle cx="290" cy="210" r="38"/>
    <!-- Spokes -->
    <g stroke-width="2" stroke="#666">
      <line x1="110" y1="172" x2="110" y2="248"/>
      <line x1="72" y1="210" x2="148" y2="210"/>
      <line x1="83" y1="183" x2="137" y2="237"/>
      <line x1="137" y1="183" x2="83" y2="237"/>
      <line x1="290" y1="172" x2="290" y2="248"/>
      <line x1="252" y1="210" x2="328" y2="210"/>
      <line x1="263" y1="183" x2="317" y2="237"/>
      <line x1="317" y1="183" x2="263" y2="237"/>
    </g>
    <!-- Frame -->
    <line x1="110" y1="210" x2="170" y2="140"/>
    <line x1="170" y1="140" x2="250" y2="140"/>
    <line x1="250" y1="140" x2="290" y2="210"/>
    <line x1="170" y1="140" x2="200" y2="210"/>
    <line x1="200" y1="210" x2="290" y2="210"/>
    <line x1="200" y1="210" x2="250" y2="140"/>
    <!-- Seat post & seat -->
    <line x1="170" y1="140" x2="165" y2="118"/>
    <line x1="148" y1="118" x2="185" y2="118" stroke-width="8"/>
    <!-- Handlebar stem -->
    <line x1="250" y1="140" x2="258" y2="105"/>
    <line x1="245" y1="105" x2="275" y2="100" stroke-width="6"/>
    <!-- Pedals / crank -->
    <circle cx="200" cy="210" r="8" fill="#333"/>
    <line x1="200" y1="210" x2="215" y2="230"/>
    <line x1="200" y1="210" x2="185" y2="190"/>
    <line x1="208" y1="232" x2="224" y2="230" stroke-width="6"/>
    <line x1="178" y1="188" x2="194" y2="190" stroke-width="6"/>
  </g>

  <!-- Pelican -->
  <g>
    <!-- Legs -->
    <g stroke="#f0a020" stroke-width="6" fill="none" stroke-linecap="round">
      <line x1="175" y1="120" x2="190" y2="165"/>
      <line x1="190" y1="165" x2="185" y2="188"/>
      <line x1="180" y1="120" x2="210" y2="200"/>
      <line x1="210" y1="200" x2="215" y2="230"/>
    </g>
    <!-- Body -->
    <ellipse cx="170" cy="105" rx="48" ry="32" fill="#f6f6f6" stroke="#333" stroke-width="3"/>
    <!-- Tail feathers -->
    <path d="M125 100 L100 88 L118 108 L98 112 L122 116 Z" fill="#e5e5e5" stroke="#333" stroke-width="3"/>
    <!-- Wing -->
    <path d="M150 100 Q175 80 205 105 Q180 120 150 100 Z" fill="#dcdcdc" stroke="#333" stroke-width="3"/>
    <!-- Neck -->
    <path d="M200 90 Q225 70 232 45" stroke="#f6f6f6" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M200 90 Q225 70 232 45" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="0" opacity="0"/>
    <!-- Head -->
    <circle cx="235" cy="40" r="17" fill="#f6f6f6" stroke="#333" stroke-width="3"/>
    <!-- Beak (upper) -->
    <path d="M248 36 L310 44 L250 50 Z" fill="#f5b942" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
    <!-- Pouch (lower beak) -->
    <path d="M250 50 L310 44 Q290 70 250 60 Z" fill="#f0a030" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
    <!-- Eye -->
    <circle cx="240" cy="35" r="4" fill="#333"/>
    <circle cx="241.5" cy="33.5" r="1.3" fill="#fff"/>
    <!-- Arm/wing to handlebar -->
    <path d="M205 95 Q235 100 258 104" stroke="#e0e0e0" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M205 95 Q235 100 258 104" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Motion lines -->
  <g stroke="#999" stroke-width="3" stroke-linecap="round">
    <line x1="30" y1="190" x2="55" y2="190"/>
    <line x1="20" y1="205" x2="50" y2="205"/>
    <line x1="35" y1="220" x2="55" y2="220"/>
  </g>
</svg>