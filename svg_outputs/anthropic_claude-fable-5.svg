<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Background -->
  <rect width="400" height="300" fill="#87CEEB"/>
  <circle cx="340" cy="50" r="25" fill="#FFD700"/>
  <rect y="230" width="400" height="70" fill="#90B860"/>
  <line x1="0" y1="232" x2="400" y2="232" stroke="#7CA050" stroke-width="3"/>

  <!-- Bicycle -->
  <!-- Wheels -->
  <circle cx="120" cy="220" r="40" fill="none" stroke="#333" stroke-width="4"/>
  <circle cx="120" cy="220" r="5" fill="#333"/>
  <circle cx="280" cy="220" r="40" fill="none" stroke="#333" stroke-width="4"/>
  <circle cx="280" cy="220" r="5" fill="#333"/>
  <!-- Spokes -->
  <g stroke="#888" stroke-width="1.5">
    <line x1="120" y1="180" x2="120" y2="260"/>
    <line x1="80" y1="220" x2="160" y2="220"/>
    <line x1="92" y1="192" x2="148" y2="248"/>
    <line x1="92" y1="248" x2="148" y2="192"/>
    <line x1="280" y1="180" x2="280" y2="260"/>
    <line x1="240" y1="220" x2="320" y2="220"/>
    <line x1="252" y1="192" x2="308" y2="248"/>
    <line x1="252" y1="248" x2="308" y2="192"/>
  </g>
  <!-- Frame -->
  <g stroke="#E63946" stroke-width="5" fill="none" stroke-linecap="round">
    <line x1="120" y1="220" x2="180" y2="160"/>
    <line x1="180" y1="160" x2="250" y2="160"/>
    <line x1="250" y1="160" x2="280" y2="220"/>
    <line x1="120" y1="220" x2="200" y2="220"/>
    <line x1="200" y1="220" x2="250" y2="160"/>
    <line x1="200" y1="220" x2="180" y2="160"/>
  </g>
  <!-- Seat -->
  <line x1="180" y1="160" x2="172" y2="138" stroke="#333" stroke-width="4"/>
  <ellipse cx="170" cy="135" rx="18" ry="6" fill="#333"/>
  <!-- Handlebars -->
  <line x1="250" y1="160" x2="262" y2="125" stroke="#333" stroke-width="4"/>
  <path d="M 262 125 Q 275 118 282 128" fill="none" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <!-- Pedals -->
  <circle cx="200" cy="220" r="8" fill="#555"/>
  <line x1="200" y1="220" x2="215" y2="238" stroke="#333" stroke-width="3"/>
  <rect x="208" y="235" width="16" height="5" fill="#333"/>

  <!-- Pelican -->
  <!-- Body -->
  <ellipse cx="170" cy="115" rx="38" ry="28" fill="#FFF" stroke="#DDD" stroke-width="2"/>
  <!-- Tail feathers -->
  <path d="M 138 105 Q 120 95 118 110 Q 130 115 140 115 Z" fill="#FFF" stroke="#DDD" stroke-width="2"/>
  <!-- Wing -->
  <path d="M 160 105 Q 185 100 190 120 Q 175 128 158 122 Z" fill="#F0F0F0" stroke="#DDD" stroke-width="2"/>
  <!-- Leg to pedal -->
  <path d="M 185 135 Q 200 175 213 235" fill="none" stroke="#FF8C00" stroke-width="5" stroke-linecap="round"/>
  <!-- Neck -->
  <path d="M 195 100 Q 215 85 220 65" fill="none" stroke="#FFF" stroke-width="14" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="222" cy="60" r="14" fill="#FFF" stroke="#DDD" stroke-width="2"/>
  <!-- Eye -->
  <circle cx="227" cy="55" r="3" fill="#333"/>
  <circle cx="228" cy="54" r="1" fill="#FFF"/>
  <!-- Beak with pouch -->
  <path d="M 233 58 L 285 70 L 235 72 Z" fill="#FF8C00" stroke="#E07000" stroke-width="1.5"/>
  <path d="M 235 72 Q 255 90 280 71 L 285 70 L 235 72" fill="#FFA840" stroke="#E07000" stroke-width="1.5"/>
  <!-- Wing arm to handlebar -->
  <path d="M 195 110 Q 235 115 262 127" fill="none" stroke="#F0F0F0" stroke-width="7" stroke-linecap="round"/>

  <!-- Motion lines -->
  <g stroke="#FFF" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <line x1="40" y1="180" x2="65" y2="180"/>
    <line x1="30" y1="200" x2="60" y2="200"/>
    <line x1="45" y1="160" x2="70" y2="160"/>
  </g>
</svg>