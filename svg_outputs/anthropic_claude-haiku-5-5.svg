<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <!-- Sky -->
  <rect width="400" height="300" fill="#bfe6ff"/>
  <!-- Sun -->
  <circle cx="340" cy="50" r="28" fill="#ffd54a"/>
  <!-- Ground -->
  <rect x="0" y="262" width="400" height="38" fill="#7cbf5a"/>
  <rect x="0" y="262" width="400" height="6" fill="#5a9e3e"/>

  <!-- Wheels -->
  <g fill="none" stroke="#222" stroke-width="7">
    <circle cx="110" cy="220" r="40"/>
    <circle cx="290" cy="220" r="40"/>
  </g>
  <g fill="#ccc">
    <circle cx="110" cy="220" r="4"/>
    <circle cx="290" cy="220" r="4"/>
  </g>

  <!-- Bicycle frame -->
  <g stroke="#e0302a" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="110" y1="220" x2="165" y2="150"/>   <!-- seat stay -->
    <line x1="165" y1="150" x2="190" y2="220"/>   <!-- seat tube -->
    <line x1="190" y1="220" x2="265" y2="150"/>   <!-- down tube -->
    <line x1="165" y1="150" x2="265" y2="150"/>   <!-- top tube -->
    <line x1="110" y1="220" x2="190" y2="220"/>   <!-- chainstay -->
    <line x1="265" y1="150" x2="262" y2="138"/>   <!-- stem -->
  </g>
  <!-- Handlebar -->
  <path d="M262 138 L272 136 L280 142" stroke="#222" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Saddle -->
  <path d="M150 146 Q165 138 180 146" stroke="#222" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Pedal crank -->
  <line x1="190" y1="220" x2="205" y2="205" stroke="#555" stroke-width="5" stroke-linecap="round"/>
  <rect x="200" y="200" width="12" height="6" fill="#333"/>

  <!-- Pelican tail -->
  <path d="M135 118 L100 104 L106 130 Z" fill="#8a8f98"/>

  <!-- Pelican leg -->
  <path d="M170 140 L184 200 L198 204" stroke="#f0a030" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Pelican foot -->
  <path d="M194 200 L210 204 L200 210 Z" fill="#f0a030"/>

  <!-- Pelican body -->
  <ellipse cx="175" cy="115" rx="52" ry="32" transform="rotate(-15 175 115)" fill="#f2f2f2" stroke="#8a8f98" stroke-width="2"/>

  <!-- Wing -->
  <path d="M130 108 Q165 68 222 96 Q188 124 130 128 Z" fill="#c9ced6" stroke="#8a8f98" stroke-width="2"/>
  <path d="M150 112 Q175 96 205 102" stroke="#8a8f98" stroke-width="2" fill="none"/>

  <!-- Neck -->
  <path d="M205 100 Q225 85 240 72" stroke="#f2f2f2" stroke-width="22" fill="none" stroke-linecap="round"/>
  <path d="M205 100 Q225 85 240 72" stroke="#8a8f98" stroke-width="2" fill="none" stroke-dasharray="0" opacity="0"/>

  <!-- Head -->
  <circle cx="248" cy="66" r="20" fill="#f2f2f2" stroke="#8a8f98" stroke-width="2"/>

  <!-- Bill with pouch -->
  <path d="M262 58 L352 82 Q340 96 318 98 Q296 100 282 90 Q270 84 262 78 Z" fill="#f0a030"/>
  <path d="M262 78 Q282 90 300 88 Q322 86 352 82 L340 96 Q320 104 296 100 Q276 96 262 84 Z" fill="#e88a1a"/>
  <line x1="264" y1="72" x2="346" y2="84" stroke="#b86a10" stroke-width="2"/>

  <!-- Eye -->
  <circle cx="254" cy="62" r="4" fill="#111"/>
  <circle cx="255" cy="61" r="1.2" fill="#fff"/>

  <!-- Motion lines -->
  <g stroke="#7aa6c9" stroke-width="3" stroke-linecap="round">
    <line x1="30" y1="170" x2="70" y2="170"/>
    <line x1="20" y1="195" x2="60" y2="195"/>
    <line x1="40" y1="145" x2="75" y2="145"/>
  </g>
</svg>