<svg viewBox="0 0 500 400" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <!-- Background / Sun / Ground -->
  <circle cx="400" cy="80" r="35" fill="#FFD166" opacity="0.8" />
  <line x1="50" y1="310" x2="450" y2="310" stroke="#A0D0A0" stroke-width="6" stroke-linecap="round" />
  
  <!-- Shadow -->
  <ellipse cx="250" cy="310" rx="180" ry="15" fill="#E0E0E0" opacity="0.7" />

  <!-- Motion Lines -->
  <line x1="80" y1="200" x2="50" y2="200" stroke="#D3D3D3" stroke-width="4" stroke-linecap="round" />
  <line x1="90" y1="220" x2="60" y2="220" stroke="#D3D3D3" stroke-width="4" stroke-linecap="round" />
  <line x1="70" y1="240" x2="40" y2="240" stroke="#D3D3D3" stroke-width="4" stroke-linecap="round" />

  <!-- ================= BICYCLE ================= -->
  
  <!-- Rear Wheel -->
  <g>
    <circle cx="150" cy="250" r="50" fill="none" stroke="#2B2D42" stroke-width="10" />
    <circle cx="150" cy="250" r="42" fill="none" stroke="#8D99AE" stroke-width="3" />
    <!-- Spokes -->
    <g stroke="#8D99AE" stroke-width="2">
      <line x1="150" y1="200" x2="150" y2="300" />
      <line x1="100" y1="250" x2="200" y2="250" />
      <line x1="115" y1="215" x2="185" y2="285" />
      <line x1="115" y1="285" x2="185" y2="215" />
    </g>
    <circle cx="150" cy="250" r="8" fill="#2B2D42" />
  </g>

  <!-- Front Wheel -->
  <g>
    <circle cx="350" cy="250" r="50" fill="none" stroke="#2B2D42" stroke-width="10" />
    <circle cx="350" cy="250" r="42" fill="none" stroke="#8D99AE" stroke-width="3" />
    <!-- Spokes -->
    <g stroke="#8D99AE" stroke-width="2">
      <line x1="350" y1="200" x2="350" y2="300" />
      <line x1="300" y1="250" x2="400" y2="250" />
      <line x1="315" y1="215" x2="385" y2="285" />
      <line x1="315" y1="285" x2="385" y2="215" />
    </g>
    <circle cx="350" cy="250" r="8" fill="#2B2D42" />
  </g>

  <!-- Bike Frame -->
  <g stroke="#E63946" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Rear Triangle -->
    <polyline points="150,250 220,160 250,250 150,250" />
    <!-- Top Tube -->
    <line x1="220" y1="160" x2="320" y2="160" />
    <!-- Down Tube -->
    <line x1="250" y1="250" x2="320" y2="160" />
    <!-- Fork -->
    <line x1="320" y1="160" x2="350" y2="250" />
  </g>

  <!-- Bike Details: Seat, Handlebars, Bell -->
  <g>
    <!-- Seat Post & Seat -->
    <line x1="220" y1="160" x2="220" y2="145" stroke="#555" stroke-width="6" />
    <ellipse cx="220" cy="145" rx="25" ry="8" fill="#2B2D42" />
    
    <!-- Handlebar Stem & Handlebars -->
    <line x1="320" y1="160" x2="320" y2="140" stroke="#555" stroke-width="6" stroke-linecap="round" />
    <path d="M 300 140 Q 320 125 335 145" fill="none" stroke="#2B2D42" stroke-width="8" stroke-linecap="round" />
    
    <!-- Bell -->
    <circle cx="310" cy="135" r="6" fill="#FFD166" />
    <line x1="309" y1="135" x2="311" y2="135" stroke="#555" stroke-width="2" />
  </g>

  <!-- Pedals & Crank -->
  <g>
    <!-- Bottom Bracket -->
    <circle cx="250" cy="250" r="12" fill="#555" />
    <!-- Crank Arm 1 (Front) -->
    <line x1="250" y1="250" x2="265" y2="275" stroke="#8D99AE" stroke-width="8" stroke-linecap="round" />
    <!-- Pedal 1 -->
    <rect x="255" y="275" width="20" height="8" rx="3" fill="#2B2D42" />
    <!-- Crank Arm 2 (Back) -->
    <line x1="250" y1="250" x2="235" y2="225" stroke="#666" stroke-width="8" stroke-linecap="round" />
    <!-- Pedal 2 -->
    <rect x="225" y="217" width="20" height="8" rx="3" fill="#2B2D42" />
  </g>

  <!-- ================= PELICAN ================= -->
  
  <!-- Pelican Legs -->
  <g stroke="#E76F51" stroke-width="8" stroke-linecap="round">
    <!-- Back Leg -->
    <line x1="195" y1="170" x2="235" y2="225" />
    <path d="M 235 225 L 245 235 M 235 225 L 250 228 M 235 225 L 240 240" stroke-width="6" />
    <!-- Front Leg -->
    <line x1="205" y1="170" x2="265" y2="275" />
    <path d="M 265 275 L 275 285 M 265 275 L 285 278 M 265 275 L 270 290" stroke-width="6" />
  </g>

  <!-- Pelican Body -->
  <ellipse cx="190" cy="130" rx="48" ry="58" fill="#FFFFFF" stroke="#D3D3D3" stroke-width="2" />

  <!-- Pelican Neck & Head -->
  <g>
    <!-- Neck Outline -->
    <path d="M 210 80 Q 250 40 260 40 Q 280 40 270 60 Q 240 100 220 110" fill="none" stroke="#D3D3D3" stroke-width="28" stroke-linecap="round" />
    <!-- Neck Fill -->
    <path d="M 210 80 Q 250 40 260 40 Q 280 40 270 60 Q 240 100 220 110" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" />
    <!-- Head -->
    <circle cx="260" cy="45" r="22" fill="#FFFFFF" stroke="#D3D3D3" stroke-width="2" />
  </g>

  <!-- Pelican Eye -->
  <circle cx="268" cy="40" r="4.5" fill="#2B2D42" />
  <circle cx="269" cy="39" r="1.5" fill="#FFFFFF" />

  <!-- Pelican Beak -->
  <g>
    <!-- Upper Beak -->
    <path d="M 278 35 Q 340 35 370 40 L 365 48 Q 320 48 278 45 Z" fill="#F4A261" stroke="#E76F51" stroke-width="2" />
    <!-- Pouch (Lower Beak) -->
    <path d="M 278 45 Q 320 85 365 48 Q 330 65 278 52 Z" fill="#E76F51" stroke="#CC5A3B" stroke-width="2" />
    <!-- Mouth Line -->
    <path d="M 278 45 Q 320 48 365 48" fill="none" stroke="#2B2D42" stroke-width="2" />
  </g>

  <!-- Pelican Wing (Holding Handlebars) -->
  <g>
    <path d="M 165 105 Q 240 110 315 140 Q 310 155 290 155 Q 230 140 165 130 Z" fill="#F0F0F0" stroke="#D3D3D3" stroke-width="2" />
    <!-- Feather Details -->
    <path d="M 290 155 L 280 140 M 270 150 L 260 135 M 250 145 L 240 130" stroke="#D3D3D3" stroke-width="2" fill="none" stroke-linecap="round" />
  </g>

</svg>