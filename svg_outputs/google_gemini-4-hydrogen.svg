<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Sky Background -->
  <rect width="400" height="300" fill="#E8F4F8" />

  <!-- Subtle Clouds -->
  <g fill="#FFFFFF" opacity="0.85">
    <ellipse cx="75" cy="55" rx="28" ry="12" />
    <ellipse cx="95" cy="50" rx="20" ry="14" />
    <ellipse cx="320" cy="45" rx="24" ry="10" />
    <ellipse cx="338" cy="42" rx="18" ry="12" />
  </g>

  <!-- Ground & Road -->
  <rect x="0" y="262" width="400" height="38" fill="#D5DFE5" />
  <line x1="0" y1="262" x2="400" y2="262" stroke="#B0C0C9" stroke-width="2" />

  <!-- Ground Shadows -->
  <ellipse cx="115" cy="264" rx="34" ry="4" fill="#9EB0BA" opacity="0.5" />
  <ellipse cx="285" cy="264" rx="34" ry="4" fill="#9EB0BA" opacity="0.5" />

  <!-- Far Crank & Pelican Far Leg -->
  <g>
    <line x1="180" y1="220" x2="164" y2="198" stroke="#6C757D" stroke-width="4" stroke-linecap="round" />
    <rect x="156" y="195" width="14" height="5" rx="2" fill="#343A40" />
    <!-- Far Leg -->
    <path d="M 158 148 L 166 175 L 163 196" fill="none" stroke="#E07A22" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 156 196 L 170 196 L 166 192 Z" fill="#E07A22" />
  </g>

  <!-- Bicycle Wheels -->
  <!-- Back Wheel -->
  <g stroke="#343A40" fill="none">
    <circle cx="115" cy="220" r="40" stroke-width="6" />
    <circle cx="115" cy="220" r="35" stroke="#ADB5BD" stroke-width="2" />
    <!-- Spokes -->
    <g stroke="#ADB5BD" stroke-width="1.2">
      <line x1="115" y1="185" x2="115" y2="255" />
      <line x1="80" y1="220" x2="150" y2="220" />
      <line x1="90" y1="195" x2="140" y2="245" />
      <line x1="140" y1="195" x2="90" y2="245" />
    </g>
    <circle cx="115" cy="220" r="5" fill="#495057" stroke="none" />
  </g>

  <!-- Front Wheel -->
  <g stroke="#343A40" fill="none">
    <circle cx="285" cy="220" r="40" stroke-width="6" />
    <circle cx="285" cy="220" r="35" stroke="#ADB5BD" stroke-width="2" />
    <!-- Spokes -->
    <g stroke="#ADB5BD" stroke-width="1.2">
      <line x1="285" y1="185" x2="285" y2="255" />
      <line x1="250" y1="220" x2="320" y2="220" />
      <line x1="260" y1="195" x2="310" y2="245" />
      <line x1="310" y1="195" x2="260" y2="245" />
    </g>
    <circle cx="285" cy="220" r="5" fill="#495057" stroke="none" />
  </g>

  <!-- Bicycle Frame -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Seat post & Handlebar stem -->
    <line x1="154" y1="166" x2="151" y2="152" stroke="#ADB5BD" stroke-width="5" />
    <path d="M 255 148 L 248 122 C 246 116, 238 117, 233 121" fill="none" stroke="#ADB5BD" stroke-width="5" />
    <!-- Handlebar grip -->
    <line x1="236" y1="119" x2="226" y2="123" stroke="#343A40" stroke-width="7" />

    <!-- Main Frame (Teal/Coral Red) -->
    <g fill="none" stroke="#E63946" stroke-width="6">
      <!-- Rear triangle -->
      <line x1="115" y1="220" x2="180" y2="220" />
      <line x1="115" y1="220" x2="156" y2="165" />
      <!-- Seat tube -->
      <line x1="180" y1="220" x2="154" y2="162" />
      <!-- Top tube & Down tube -->
      <line x1="156" y1="165" x2="254" y2="150" />
      <line x1="180" y1="220" x2="258" y2="160" />
      <!-- Head tube & Fork -->
      <line x1="253" y1="145" x2="285" y2="220" />
    </g>

    <!-- Chainring -->
    <circle cx="180" cy="220" r="12" fill="#CED4DA" stroke="#6C757D" stroke-width="2" />
    <circle cx="180" cy="220" r="4" fill="#495057" />

    <!-- Saddle -->
    <path d="M 136 151 C 142 148, 162 148, 166 153 C 166 156, 142 157, 136 151 Z" fill="#343A40" />
  </g>

  <!-- Pelican Body, Neck & Head -->
  <g>
    <!-- Head Crest -->
    <path d="M 178 52 Q 168 45, 164 52 Q 170 54, 174 58 Z" fill="#F4F6F8" stroke="#D5DCE2" stroke-width="1.5" />

    <!-- Main Body & Neck Silhouette -->
    <path d="M 103 118
             C 120 118, 145 108, 162 95
             C 172 85, 174 68, 176 58
             C 178 46, 198 46, 202 58
             C 205 68, 196 85, 192 102
             C 198 128, 185 152, 155 152
             C 132 152, 114 138, 103 118 Z"
          fill="#FFFFFF" stroke="#D5DCE2" stroke-width="2" stroke-linejoin="round" />

    <!-- Tail feather accents -->
    <path d="M 106 122 L 118 124 M 110 128 L 122 129" stroke="#D5DCE2" stroke-width="1.5" stroke-linecap="round" />

    <!-- Pelican Pouch (Gular Sac) -->
    <path d="M 196 66 C 206 98, 248 106, 282 74 L 198 63 Z"
          fill="#F99D33" stroke="#E07A22" stroke-width="2" stroke-linejoin="round" />

    <!-- Upper Beak -->
    <path d="M 198 56 Q 246 54, 286 71 C 289 75, 284 80, 280 75 Q 240 65, 196 65 Z"
          fill="#FFC145" stroke="#E07A22" stroke-width="2" stroke-linejoin="round" />

    <!-- Eye -->
    <circle cx="188" cy="58" r="3.8" fill="#212529" />
    <circle cx="189.2" cy="56.8" r="1.2" fill="#FFFFFF" />
  </g>

  <!-- Near Leg, Foot & Crank/Pedal -->
  <g>
    <!-- Near Leg -->
    <path d="M 164 146 L 185 190 L 195 236" fill="none" stroke="#F58A27" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Webbed Foot -->
    <path d="M 188 236 L 207 237 C 209 237, 209 240, 206 240 L 188 240 Z" fill="#F58A27" stroke="#E07A22" stroke-width="1" />

    <!-- Near Crank & Pedal -->
    <line x1="180" y1="220" x2="196" y2="241" stroke="#ADB5BD" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="180" cy="220" r="3" fill="#495057" />
    <rect x="188" y="239" width="16" height="5" rx="2" fill="#343A40" />
  </g>

  <!-- Pelican Wing Reaching to Handlebar -->
  <g>
    <path d="M 148 114
             C 166 105, 198 112, 232 119
             C 237 120, 236 127, 229 127
             C 202 128, 174 139, 150 133
             C 140 130, 140 118, 148 114 Z"
          fill="#F4F6F8" stroke="#CED6DE" stroke-width="2" stroke-linejoin="round" />
    <!-- Wing feather lines -->
    <path d="M 162 122 C 178 122, 192 123, 204 123" fill="none" stroke="#DCE2E8" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 158 128 C 172 129, 184 128, 196 127" fill="none" stroke="#DCE2E8" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>