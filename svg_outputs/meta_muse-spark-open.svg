<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350" role="img">
<title>Pelican riding a bicycle</title>
<!-- Sky -->
<rect width="500" height="350" fill="#B3E5FC"/>
<ellipse cx="420" cy="50" rx="35" ry="18" fill="white" opacity="0.9"/>
<ellipse cx="440" cy="60" rx="30" ry="15" fill="white" opacity="0.9"/>
<ellipse cx="80" cy="65" rx="30" ry="14" fill="white" opacity="0.9"/>

<!-- Ground -->
<rect x="0" y="280" width="500" height="70" fill="#A7D8A0"/>
<rect x="0" y="280" width="500" height="8" fill="#8BC34A"/>

<!-- BICYCLE -->
<g id="bicycle" stroke-linecap="round" stroke-linejoin="round">
  <!-- Wheels -->
  <g id="wheels">
    <!-- Rear Wheel -->
    <circle cx="150" cy="250" r="52" fill="none" stroke="#212121" stroke-width="8"/>
    <circle cx="150" cy="250" r="48" fill="none" stroke="#757575" stroke-width="2"/>
    <circle cx="150" cy="250" r="5" fill="#212121"/>
    <!-- Spokes rear -->
    <g stroke="#9E9E9E" stroke-width="1.5">
      <line x1="150" y1="202" x2="150" y2="298"/>
      <line x1="102" y1="250" x2="198" y2="250"/>
      <line x1="116" y1="216" x2="184" y2="284"/>
      <line x1="116" y1="284" x2="184" y2="216"/>
    </g>
    <!-- Front Wheel -->
    <circle cx="330" cy="250" r="52" fill="none" stroke="#212121" stroke-width="8"/>
    <circle cx="330" cy="250" r="48" fill="none" stroke="#757575" stroke-width="2"/>
    <circle cx="330" cy="250" r="5" fill="#212121"/>
    <!-- Spokes front -->
    <g stroke="#9E9E9E" stroke-width="1.5">
      <line x1="330" y1="202" x2="330" y2="298"/>
      <line x1="282" y1="250" x2="378" y2="250"/>
      <line x1="296" y1="216" x2="364" y2="284"/>
      <line x1="296" y1="284" x2="364" y2="216"/>
    </g>
  </g>

  <!-- Frame -->
  <g stroke="#E53935" stroke-width="7" fill="none">
    <line x1="150" y1="250" x2="210" y2="225" /> <!-- chain stay -->
    <line x1="210" y1="225" x2="190" y2="165" /> <!-- seat tube -->
    <line x1="190" y1="165" x2="150" y2="250" /> <!-- seat stay -->
    <line x1="190" y1="165" x2="295" y2="170" /> <!-- top tube -->
    <line x1="210" y1="225" x2="295" y2="170" /> <!-- down tube -->
    <line x1="295" y1="170" x2="315" y2="225" stroke="#212121" /> <!-- fork -->
  </g>
  
  <!-- Details -->
  <g fill="#212121">
    <ellipse cx="190" cy="155" rx="22" ry="7" /> <!-- seat -->
    <line x1="295" y1="170" x2="312" y2="160" stroke="#212121" stroke-width="6" /> <!-- handlebar stem -->
    <line x1="302" y1="155" x2="320" y2="150" stroke="#424242" stroke-width="5" stroke-linecap="round"/> <!-- handlebars -->
    <circle cx="210" cy="225" r="10" fill="#424242" stroke="#212121" stroke-width="2"/> <!-- chainring -->
  </g>
  <!-- Pedal -->
  <g stroke="#212121" stroke-width="4">
    <line x1="210" y1="225" x2="205" y2="255" />
    <ellipse cx="205" cy="260" rx="12" ry="6" fill="#424242"/>
  </g>
</g>

<!-- PELICAN -->
<g id="pelican">
  <!-- Tail -->
  <path d="M 155 185 Q 130 175 138 200 Q 145 190 155 195 Z" fill="#E6E6E6" stroke="#212121" stroke-width="3" stroke-linejoin="round"/>
  <!-- Body -->
  <ellipse cx="200" cy="180" rx="58" ry="42" fill="white" stroke="#212121" stroke-width="4"/>
  <!-- Wing -->
  <ellipse cx="192" cy="185" rx="32" ry="22" fill="#EEEEEE" stroke="#212121" stroke-width="3"/>
  <path d="M 175 180 Q 190 195 205 180" fill="none" stroke="#BDBDBD" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 182 188 Q 195 200 210 188" fill="none" stroke="#BDBDBD" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Neck -->
  <path d="M 240 170 Q 255 140 265 125" fill="white" stroke="#212121" stroke-width="4" stroke-linejoin="round"/>
  <!-- Head -->
  <circle cx="268" cy="118" r="30" fill="white" stroke="#212121" stroke-width="4"/>
  <!-- Beak - upper -->
  <path d="M 285 103 C 330 95 375 105 390 118 L 285 122 Z" fill="#FF9800" stroke="#212121" stroke-width="3" stroke-linejoin="round"/>
  <!-- Beak - pouch/lower -->
  <path d="M 285 122 L 390 118 C 375 155 340 182 258 148 Z" fill="#FFCC80" stroke="#212121" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 285 122 L 390 118" stroke="#212121" stroke-width="2"/>
  <!-- Eye -->
  <circle cx="262" cy="108" r="8" fill="white" stroke="#212121" stroke-width="2"/>
  <circle cx="263" cy="109" r="4" fill="#212121"/>
  <circle cx="264.5" cy="107.5" r="1.2" fill="white"/>
  <!-- Little feather tuft -->
  <path d="M 250 95 Q 245 80 255 88 Q 258 75 262 90" fill="white" stroke="#212121" stroke-width="2" stroke-linejoin="round"/>
  <!-- Legs -->
  <path d="M 194 212 Q 200 230 205 255" fill="none" stroke="#FF9800" stroke-width="5" stroke-linecap="round"/>
  <path d="M 212 210 Q 220 225 222 235" fill="none" stroke="#FF9800" stroke-width="5" stroke-linecap="round"/>
  <!-- Feet on pedals -->
  <ellipse cx="206" cy="258" rx="10" ry="4" fill="#FF9800" stroke="#212121" stroke-width="2"/>
  <!-- Tiny helmet for safety! -->
  <path d="M 248 92 A 28 20 0 0 1 288 106 L 285 110 Q 268 85 248 92 Z" fill="#29B6F6" stroke="#212121" stroke-width="2.5"/>
  <circle cx="288" cy="106" r="3" fill="#212121"/>
</g>
</svg>