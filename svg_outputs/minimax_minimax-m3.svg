<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <!-- Background sky -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#E0F6FF"/>
    </linearGradient>
    <radialGradient id="wheelGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#666"/>
      <stop offset="100%" stop-color="#222"/>
    </radialGradient>
  </defs>
  <rect width="600" height="500" fill="url(#sky)"/>
  
  <!-- Ground -->
  <rect y="420" width="600" height="80" fill="#8FBC8F"/>
  <line x1="0" y1="420" x2="600" y2="420" stroke="#6B8E23" stroke-width="2"/>

  <!-- Back wheel -->
  <g>
    <circle cx="170" cy="380" r="60" fill="none" stroke="#222" stroke-width="6"/>
    <circle cx="170" cy="380" r="8" fill="#444"/>
    <!-- Spokes -->
    <line x1="170" y1="320" x2="170" y2="440" stroke="#888" stroke-width="2"/>
    <line x1="110" y1="380" x2="230" y2="380" stroke="#888" stroke-width="2"/>
    <line x1="128" y1="338" x2="212" y2="422" stroke="#888" stroke-width="2"/>
    <line x1="212" y1="338" x2="128" y2="422" stroke="#888" stroke-width="2"/>
  </g>

  <!-- Front wheel -->
  <g>
    <circle cx="430" cy="380" r="60" fill="none" stroke="#222" stroke-width="6"/>
    <circle cx="430" cy="380" r="8" fill="#444"/>
    <line x1="430" y1="320" x2="430" y2="440" stroke="#888" stroke-width="2"/>
    <line x1="370" y1="380" x2="490" y2="380" stroke="#888" stroke-width="2"/>
    <line x1="388" y1="338" x2="472" y2="422" stroke="#888" stroke-width="2"/>
    <line x1="472" y1="338" x2="388" y2="422" stroke="#888" stroke-width="2"/>
  </g>

  <!-- Bicycle frame -->
  <line x1="170" y1="380" x2="300" y2="280" stroke="#D32F2F" stroke-width="8" stroke-linecap="round"/>
  <line x1="300" y1="280" x2="430" y2="380" stroke="#D32F2F" stroke-width="8" stroke-linecap="round"/>
  <line x1="300" y1="280" x2="260" y2="380" stroke="#D32F2F" stroke-width="8" stroke-linecap="round"/>
  <line x1="260" y1="380" x2="170" y2="380" stroke="#D32F2F" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Seat post and seat -->
  <line x1="300" y1="280" x2="290" y2="240" stroke="#333" stroke-width="5"/>
  <ellipse cx="285" cy="235" rx="18" ry="6" fill="#222"/>

  <!-- Handlebar stem -->
  <line x1="430" y1="380" x2="410" y2="270" stroke="#333" stroke-width="5"/>
  <!-- Handlebars -->
  <line x1="385" y1="265" x2="435" y2="265" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <circle cx="385" cy="265" r="5" fill="#222"/>
  <circle cx="435" cy="265" r="5" fill="#222"/>

  <!-- Pedal crank -->
  <circle cx="300" cy="380" r="12" fill="#555"/>
  <line x1="300" y1="380" x2="320" y2="395" stroke="#333" stroke-width="5"/>
  <rect x="312" y="390" width="18" height="6" fill="#222"/>

  <!-- PELICAN BODY -->
  <!-- Tail feathers -->
  <path d="M 280 260 Q 250 250 240 270 Q 245 285 270 280 Z" fill="#F5F5DC" stroke="#333" stroke-width="2"/>
  
  <!-- Body -->
  <ellipse cx="320" cy="220" rx="70" ry="45" fill="#FFFFFF" stroke="#333" stroke-width="2.5"/>
  
  <!-- Wing -->
  <path d="M 310 215 Q 350 200 370 225 Q 360 245 320 240 Z" fill="#E8E8D8" stroke="#333" stroke-width="2"/>
  <path d="M 325 220 Q 345 215 360 225" fill="none" stroke="#333" stroke-width="1.5"/>
  <path d="M 325 228 Q 345 225 360 232" fill="none" stroke="#333" stroke-width="1.5"/>

  <!-- Neck -->
  <path d="M 350 195 Q 380 175 405 170 L 420 185 Q 395 195 370 215 Z" fill="#FFFFFF" stroke="#333" stroke-width="2.5"/>

  <!-- Head -->
  <ellipse cx="425" cy="160" rx="30" ry="25" fill="#FFFFFF" stroke="#333" stroke-width="2.5"/>

  <!-- Eye -->
  <circle cx="430" cy="155" r="5" fill="#FFF" stroke="#333" stroke-width="1.5"/>
  <circle cx="431" cy="155" r="3" fill="#000"/>
  <circle cx="432" cy="154" r="1" fill="#FFF"/>

  <!-- BEAK - top -->
  <path d="M 450 158 Q 510 150 540 160 Q 545 165 540 168 Q 500 170 455 168 Z" fill="#FFA500" stroke="#333" stroke-width="2"/>
  
  <!-- BEAK - pouch (lower) -->
  <path d="M 450 168 Q 480 195 510 185 Q 525 180 540 168 Q 510 175 455 170 Z" fill="#FFD580" stroke="#333" stroke-width="2"/>
  
  <!-- Beak nostril detail -->
  <ellipse cx="475" cy="160" rx="2" ry="1" fill="#333"/>

  <!-- Head crest/tuft -->
  <path d="M 410 138 Q 415 125 425 130 Q 420 140 415 145 Z" fill="#F5F5DC" stroke="#333" stroke-width="1.5"/>

  <!-- Pelican legs (on pedals) -->
  <line x1="330" y1="260" x2="315" y2="380" stroke="#FF8C00" stroke-width="5" stroke-linecap="round"/>
  <line x1="320" y1="260" x2="320" y2="378" stroke="#FF8C00" stroke-width="5" stroke-linecap="round"/>
  <!-- Foot on pedal -->
  <ellipse cx="318" cy="382" rx="10" ry="4" fill="#FF8C00" stroke="#333" stroke-width="1.5"/>

  <!-- Wing grabbing handlebar -->
  <path d="M 365 225 Q 395 240 420 260 L 425 255 Q 400 235 370 220 Z" fill="#E8E8D8" stroke="#333" stroke-width="2"/>

  <!-- Motion lines -->
  <line x1="80" y1="380" x2="110" y2="380" stroke="#333" stroke-width="2" opacity="0.5"/>
  <line x1="60" y1="395" x2="95" y2="395" stroke="#333" stroke-width="2" opacity="0.5"/>
  <line x1="70" y1="365" x2="100" y2="365" stroke="#333" stroke-width="2" opacity="0.5"/>

  <!-- Sun -->
  <circle cx="520" cy="70" r="30" fill="#FFD700" opacity="0.8"/>
  
  <!-- Cloud -->
  <ellipse cx="100" cy="80" rx="35" ry="15" fill="#FFF" opacity="0.8"/>
  <ellipse cx="120" cy="75" rx="25" ry="12" fill="#FFF" opacity="0.8"/>
  
  <!-- Title -->
  <text x="300" y="475" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="20" fill="#333" font-weight="bold">Pelican on Wheels! 🚲</text>
</svg>