<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">A pelican riding a bicycle</title>
  <desc id="desc">A cheerful white pelican with a large orange bill pedals a red bicycle.</desc>

  <defs>
    <g id="wheel">
      <circle r="90" fill="#FFFFFF" stroke="#284457" stroke-width="8"/>
      <circle r="79" fill="none" stroke="#91AAB5" stroke-width="3"/>
      <g stroke="#B2C6CD" stroke-width="2">
        <line y1="-78" y2="78"/>
        <line y1="-78" y2="78" transform="rotate(30)"/>
        <line y1="-78" y2="78" transform="rotate(60)"/>
        <line y1="-78" y2="78" transform="rotate(90)"/>
        <line y1="-78" y2="78" transform="rotate(120)"/>
        <line y1="-78" y2="78" transform="rotate(150)"/>
      </g>
      <circle r="9" fill="#F7FBFC" stroke="#284457" stroke-width="4"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" rx="28" fill="#F3FAFD"/>
  <circle cx="765" cy="88" r="43" fill="#FFE49A"/>
  <g fill="#FFFFFF" opacity="0.9">
    <path d="M72 132c5-25 39-30 51-10 17-19 52-6 49 20H72c-8 0-8-10 0-10Z"/>
    <path d="M675 267c4-20 31-25 42-9 14-16 43-5 40 16h-82c-7 0-7-7 0-7Z"/>
  </g>
  <path d="M70 532H830" stroke="#D7E7EB" stroke-width="5" stroke-linecap="round"/>
  <g fill="#DCECEF">
    <ellipse cx="270" cy="535" rx="108" ry="10"/>
    <ellipse cx="650" cy="535" rx="108" ry="10"/>
  </g>

  <!-- Motion lines -->
  <g fill="none" stroke="#B9D8E0" stroke-width="6" stroke-linecap="round">
    <path d="M104 348h82"/>
    <path d="M82 376h63"/>
    <path d="M124 404h48"/>
  </g>

  <!-- Bicycle wheels -->
  <use href="#wheel" x="270" y="440"/>
  <use href="#wheel" x="650" y="440"/>

  <!-- Bicycle frame -->
  <g fill="none" stroke="#E45C64" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M270 440 390 350 445 440Z"/>
    <path d="M390 350 560 340 575 370 445 440"/>
    <path d="M567 352 650 440"/>
    <path d="M578 370 650 440" stroke-width="6"/>
  </g>
  <g fill="none" stroke="#284457" stroke-linecap="round" stroke-linejoin="round">
    <path d="M390 350 382 329" stroke-width="7"/>
    <path d="M560 340 574 288 596 276" stroke-width="7"/>
    <path d="M596 276c17-11 42-2 36 17" stroke-width="7"/>
    <path d="M626 290h12" stroke-width="11"/>
  </g>
  <path d="M337 329q38-14 82-1l-6 12q-46-5-72 0Z" fill="#284457"/>

  <!-- Chain and pedals -->
  <g fill="none" stroke="#637D88" stroke-width="3">
    <path d="M270 434 445 418M270 446 445 462"/>
  </g>
  <circle cx="445" cy="440" r="23" fill="#F7FBFC" stroke="#284457" stroke-width="5"/>
  <g fill="none" stroke="#284457" stroke-width="6" stroke-linecap="round">
    <path d="M445 440 475 405M445 440 415 475"/>
    <path d="M460 405h34M398 475h34"/>
  </g>
  <circle cx="445" cy="440" r="6" fill="#284457"/>

  <!-- Pelican's tail -->
  <path d="M337 253 267 224q-12-4-5 10l21 29-36-6q-12-1-2 11l70 51Z"
        fill="#DFEEF1" stroke="#284457" stroke-width="5" stroke-linejoin="round"/>

  <!-- Legs and webbed feet -->
  <g fill="none" stroke="#D98E32" stroke-width="11" stroke-linecap="round">
    <path d="M389 330c-7 49 4 98 25 132"/>
    <path d="M435 332c8 28 24 52 40 70"/>
  </g>
  <g fill="#F2A93B" stroke="#284457" stroke-width="4" stroke-linejoin="round">
    <path d="M405 457 425 459 439 469 423 475 399 470Z"/>
    <path d="M465 397 484 398 500 406 486 412 461 409Z"/>
  </g>

  <!-- Bill and pouch, behind the head -->
  <path d="M568 150c82 10 170 6 247-5-30 42-74 70-127 75-60 6-103-25-120-70Z"
        fill="#FFD37A" stroke="#284457" stroke-width="5" stroke-linejoin="round"/>
  <path d="M560 117c83-3 179 10 255 28-81 9-165 13-247 6Z"
        fill="#F2A93B" stroke="#284457" stroke-width="5" stroke-linejoin="round"/>
  <path d="M603 139c69-3 132 0 187 6" fill="none" stroke="#D68A2D" stroke-width="3" stroke-linecap="round"/>

  <!-- Body, neck, and head -->
  <path d="M330 323c-30-23-34-69-16-108 20-43 68-64 116-52 20 5 34 15 45 27-6-23-14-49-2-77 15-35 56-48 87-31 29 16 36 52 18 76-17 23-49 25-68 15-12 25-7 54 5 78 16 37-5 75-40 92-43 20-106 10-145-20Z"
        fill="#FFFDF7" stroke="#284457" stroke-width="5" stroke-linejoin="round"/>

  <!-- Soft body shading -->
  <path d="M318 270c34 30 73 43 114 40 35-2 61-14 82-35 0 34-18 56-46 69-43 18-101 7-138-21-8-15-12-34-12-53Z"
        fill="#DFEEF1"/>

  <!-- Wing reaching the handlebar -->
  <path d="M382 202c26-18 61-4 81 22 26 31 72 44 130 50 17 2 24 13 15 24-9 11-28 3-42 1-60-4-115-17-150-39-25-16-42-42-34-58Z"
        fill="#F8FBFA" stroke="#284457" stroke-width="5" stroke-linejoin="round"/>
  <g fill="none" stroke="#A9C2CA" stroke-width="4" stroke-linecap="round">
    <path d="M401 220c24 5 40 19 54 35"/>
    <path d="M413 245c25 10 47 19 74 25"/>
    <path d="M580 279q17 7 11 19"/>
  </g>

  <!-- Face -->
  <circle cx="550" cy="109" r="10" fill="#FFFFFF" stroke="#284457" stroke-width="4"/>
  <circle cx="554" cy="109" r="4.5" fill="#284457"/>
  <path d="M539 92q12-7 23 0" fill="none" stroke="#284457" stroke-width="4" stroke-linecap="round"/>
  <path d="M558 169q8 5 16 0" fill="none" stroke="#D98E32" stroke-width="3" stroke-linecap="round"/>

  <!-- A few tail-feather details -->
  <g fill="none" stroke="#A9C2CA" stroke-width="3" stroke-linecap="round">
    <path d="M283 245 320 280"/>
    <path d="M267 267 315 294"/>
  </g>
</svg>