<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A cheerful white pelican riding a blue bicycle.</desc>

  <defs>
    <linearGradient id="bikeBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="beakOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <!-- Ground -->
  <path d="M60 575H740" fill="none" stroke="#b6c4c9" stroke-width="8"
        stroke-linecap="round"/>

  <!-- Wheels -->
  <g fill="none">
    <circle cx="220" cy="465" r="105" stroke="#17242b" stroke-width="12"/>
    <circle cx="580" cy="465" r="105" stroke="#17242b" stroke-width="12"/>
    <circle cx="220" cy="465" r="91" stroke="#d8e3e7" stroke-width="3"/>
    <circle cx="580" cy="465" r="91" stroke="#d8e3e7" stroke-width="3"/>

    <g stroke="#9aabb2" stroke-width="2">
      <path d="M220 360V570M115 465H325M146 391L294 539M146 539L294 391"/>
      <path d="M580 360V570M475 465H685M506 391L654 539M506 539L654 391"/>
    </g>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" stroke="url(#bikeBlue)" stroke-width="12"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M220 465L345 325L405 465Z"/>
    <path d="M345 325L505 340L405 465"/>
    <path d="M505 340L580 465"/>
  </g>

  <!-- Fork and handlebars -->
  <g fill="none" stroke="#263941" stroke-width="9"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M580 465L505 315L530 274"/>
    <path d="M499 278H570Q584 278 584 292"/>
  </g>

  <!-- Seat -->
  <path d="M315 313Q350 299 384 315" fill="none" stroke="#263941"
        stroke-width="15" stroke-linecap="round"/>

  <!-- Crank and pedals -->
  <g fill="none" stroke="#263941" stroke-linecap="round">
    <circle cx="405" cy="465" r="24" stroke-width="7"/>
    <path d="M405 465L438 490M405 465L372 440" stroke-width="7"/>
    <path d="M433 493H463M347 437H377" stroke-width="8"/>
  </g>

  <!-- Pelican body -->
  <path d="M283 286
           Q261 226 291 175
           Q319 129 370 153
           Q405 169 413 221
           Q420 269 388 319
           Q347 354 305 329
           Q291 317 283 286Z"
        fill="#f8fafc" stroke="#263941" stroke-width="7"/>

  <!-- Tail feathers -->
  <path d="M287 284L235 307L278 319L242 345L305 332"
        fill="#e7eef1" stroke="#263941" stroke-width="7"
        stroke-linejoin="round"/>

  <!-- Neck and head -->
  <path d="M351 185
           Q365 106 424 83
           Q473 64 511 91
           Q533 108 522 134
           Q510 158 474 157
           Q445 156 430 176
           Q410 205 414 250
           L365 260
           Q351 223 351 185Z"
        fill="#f8fafc" stroke="#263941" stroke-width="7"/>

  <!-- Pelican crest -->
  <path d="M438 85Q447 54 466 75Q479 45 489 82"
        fill="#f8fafc" stroke="#263941" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Beak and pouch -->
  <path d="M493 106
           Q591 104 655 128
           Q589 151 494 145
           Q473 143 468 128
           Q472 111 493 106Z"
        fill="url(#beakOrange)" stroke="#263941" stroke-width="7"
        stroke-linejoin="round"/>
  <path d="M486 144
           Q554 169 628 137
           Q594 203 511 184
           Q482 176 486 144Z"
        fill="#f59e0b" opacity=".72" stroke="#263941" stroke-width="6"/>

  <!-- Eye -->
  <circle cx="484" cy="105" r="10" fill="#fff" stroke="#263941" stroke-width="4"/>
  <circle cx="487" cy="106" r="4" fill="#17242b"/>

  <!-- Wing reaching handlebars -->
  <path d="M351 205
           Q402 206 447 241
           Q475 263 523 278
           Q511 301 482 294
           Q415 277 363 247Z"
        fill="#dfe8ec" stroke="#263941" stroke-width="7"/>
  <path d="M503 274Q519 260 536 277Q527 296 507 292"
        fill="#f8fafc" stroke="#263941" stroke-width="6"/>

  <!-- Wing feathers -->
  <g fill="none" stroke="#a6b7be" stroke-width="4" stroke-linecap="round">
    <path d="M372 222Q407 240 439 266"/>
    <path d="M367 239Q401 257 423 277"/>
  </g>

  <!-- Pelican legs -->
  <g fill="none" stroke="#f59e0b" stroke-width="11"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M330 319Q354 371 372 440"/>
    <path d="M371 323Q405 367 438 490"/>
  </g>

  <!-- Webbed feet on pedals -->
  <path d="M350 437Q363 426 376 440L391 448Q371 454 348 449Z"
        fill="#fbbf24" stroke="#263941" stroke-width="5"/>
  <path d="M430 487Q443 476 453 490L470 498Q449 504 429 499Z"
        fill="#fbbf24" stroke="#263941" stroke-width="5"/>

  <!-- Motion lines -->
  <g fill="none" stroke="#7dd3fc" stroke-width="7" stroke-linecap="round">
    <path d="M77 408H133"/>
    <path d="M55 442H111"/>
    <path d="M78 476H119"/>
  </g>
</svg>