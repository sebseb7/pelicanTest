  <!-- Legs and webbed feet -->
  <g fill="none" stroke="#e99436" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path d="M298 239L285 289L311 363"/>
    <path d="M335 243L359 280L360 321"/>
  </g>
  <g fill="#ffb64d" stroke="#344955" stroke-width="3" stroke-linejoin="round">
    <path d="M308 359L328 375L296 375L291 369Z"/>
    <path d="M357 318L380 332L349 332L345 326Z"/>
  </g>

  <!-- Wing reaching for handlebars -->
  <path d="M286 180
           C310 172 337 188 365 207
           L438 202
           Q451 204 445 215
           L362 227
