<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="A pelican riding a bicycle">
  <rect width="600" height="400" fill="#e7f7fa"/>
  <path d="M0 368H600" stroke="#a8d5b5" stroke-width="8"/>

  <!-- Wheels -->
  <g fill="none" stroke="#334155">
    <circle cx="170" cy="300" r="65" stroke-width="8"/>
    <circle cx="425" cy="300" r="65" stroke-width="8"/>
    <g stroke="#aab9c2" stroke-width="2">
      <path d="M105 300h130M170 235v130M124 254l92 92M124 346l92-92"/>
      <path d="M360 300h130M425 235v130M379 254l92 92M379 346l92-92"/>
    </g>
    <circle cx="170" cy="300" r="5" fill="#334155"/>
    <circle cx="425" cy="300" r="5" fill="#334155"/>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" stroke="#e95d51" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M170 300l91-95 39 95H170"/>
    <path d="M261 205h125l-86 95"/>
    <path d="M425 300l-39-95-8-18"/>
  </g>
  <g fill="none" stroke="#334155" stroke-width="7" stroke-linecap="round">
    <path d="M250 205h24M378 187h30q10 0 10 10"/>
    <circle cx="300" cy="300" r="13"/>
    <path d="M300 300l19 17h15"/>
  </g>

  <!-- Legs and feet -->
  <g fill="none" stroke="#d88b39" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M268 191l15 52 38 17"/>
    <path d="M294 190l-1 47 24 79"/>
    <path d="M320 260h22M317 316h21"/>
  </g>

  <!-- Body, neck and head -->
  <path d="M301 156c24-13 31-35 33-67 1-23 14-37 31-36 18 1 29 17 26 34-2 13-12 22-25 26-4 27-14 49-38 65z"
        fill="#fffdf2" stroke="#64717a" stroke-width="3"/>
  <ellipse cx="266" cy="158" rx="76" ry="46"
           fill="#fffdf2" stroke="#64717a" stroke-width="3"/>
  <path d="M216 153c24-18 65-20 100-4-8 27-29 42-55 39-20-2-35-14-45-35z"
        fill="#e5e9e7" stroke="#89959a" stroke-width="2"/>
  <path d="M198 150l-17-12 7 22-9 10 24-3"
        fill="#fffdf2" stroke="#64717a" stroke-width="3" stroke-linejoin="round"/>

  <!-- Pelican's long bill and pouch -->
  <path d="M383 82l107 26-108-8z"
        fill="#f4aa45" stroke="#a96e2b" stroke-width="3" stroke-linejoin="round"/>
  <path d="M383 100l107 8c-22 7-44 26-69 27-18 1-30-12-38-35z"
        fill="#ffd47b" stroke="#a96e2b" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="369" cy="76" r="4" fill="#263238"/>
  <circle cx="370" cy="75" r="1.3" fill="white"/>
</svg>