    <path d="M356 332q31 20 45 54l18 72 20 4"/>
    <path d="M331 329q-5 34 19 55l20 32 16 1"/>
  </g>

  <!-- Pouch and bill -->
  <path d="M530 181 Q563 246 620 235 Q660 229 694 179 Q639 201 530 181Z"
        fill="#f4bd78" stroke="#9a7258" stroke-width="3" stroke-linejoin="round"/>
  <path d="M525 163 Q605 158 710 177 Q626 190 529 184Z"
        fill="#f6b85d" stroke="#9a7258" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="511" cy="150" r="6" fill="#394c59"/>
  <circle cx="513" cy="148" r="2" fill="white"/>
  <path d="M495 133q13-9 28-5" fill="none" stroke="#52616b" stroke-width="3" stroke-linecap="round"/>
</svg>