<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Subtle shadow for grounding -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Sun (Optional, adds vibe) -->
  <circle cx="420" cy="80" r="40" fill="#FFD166" opacity="0.4"/>

  <!-- Ground Shadow -->
  <ellipse cx="250" cy="430" rx="180" ry="12" fill="#000" opacity="0.1"/>

  <!-- BICYCLE -->
  <g filter="url(#shadow)">
    <!-- Back Wheel -->
    <circle cx="130" cy="360" r="55" stroke="#333" stroke-width="6" fill="none"/>
    <circle cx="130" cy="360" r="5" fill="#888"/>
    <g stroke="#AAA" stroke-width="2">
      <line x1="130" y1="305" x2="130" y2="415"/>
      <line x1="75" y1="360" x2="185" y2="360"/>
      <line x1="91" y1="321" x2="169" y2="399"/>
      <line x1="169" y1="321" x2="91" y2="399"/>
    </g>

    <!-- Front Wheel -->
    <circle cx="370" cy="360" r="55" stroke="#333" stroke-width="6" fill="none"/>
    <circle cx="370" cy="360" r="5" fill="#888"/>
    <g stroke="#AAA" stroke-width="2">
      <line x1="370" y1="305" x2="370" y2="415"/>
      <line x1="315" y1="360" x2="425" y2="360"/>
      <line x1="331" y1="321" x2="409" y2="399"/>
      <line x1="409" y1="321" x2="331" y2="399"/>
    </g>

    <!-- Bike Frame (Red) -->
    <path d="M 130 360 L 210 360 L 350 260 L 160 250 L 130 360" fill="none" stroke="#E63946" stroke-width="8" stroke-linejoin="round"/>
    <!-- Fork -->
    <path d="M 350 260 L 370 360" stroke="#E63946" stroke-width="8" stroke-linecap="round"/>
    <!-- Seat Post -->
    <path d="M 160 250 L 150 220" stroke="#E63946" stroke-width="8"/>
    
    <!-- Seat -->
    <path d="M 130 220 Q 150 210 170 220 L 170 230 Q 150 240 130 230 Z" fill="#333"/>
    
    <!-- Handlebars -->
    <path d="M 350 260 L 340 230 Q 330 210 360 210" fill="none" stroke="#333" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Crank and Pedals -->
    <circle cx="210" cy="360" r="12" fill="#555"/>
    <!-- Pedal arm and pedal (Right side, pushing down) -->
    <line x1="210" y1="360" x2="240" y2="385" stroke="#555" stroke-width="6" stroke-linecap="round"/>
    <rect x="230" y="380" width="20" height="8" fill="#333" rx="2" transform="rotate(15 240 384)"/>
  </g>

  <!-- PELICAN -->
  <g filter="url(#shadow)">
    <!-- Far Leg (Left) -->
    <path d="M 190 310 L 180 340 L 150 345" fill="none" stroke="#E87A10" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 140 345 Q 150 340 160 345 Q 165 355 150 355 Q 135 355 140 345" fill="#FF9F1C"/>

    <!-- Body -->
    <path d="M 140 230 Q 120 310 180 330 Q 240 340 230 260 Q 220 190 180 190 Z" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="3"/>
    
    <!-- Tail Feathers -->
    <path d="M 140 260 Q 110 250 100 270 Q 120 280 140 275" fill="#E9ECEF" stroke="#DEE2E6" stroke-width="2"/>
    <path d="M 145 270 Q 115 270 110 290 Q 130 290 148 285" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="2"/>

    <!-- Neck and Head -->
    <path d="M 190 240 C 190 240, 240 200, 240 140 C 240 110, 270 110, 280 130 C 290 150, 270 170, 250 170" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="3"/>
    
    <!-- Eye -->
    <circle cx="262" cy="135" r="7" fill="#333"/>
    <circle cx="264" cy="133" r="2.5" fill="#FFF"/>

    <!-- Beak (Upper Mandible) -->
    <path d="M 270 145 L 390 150 Q 405 150 400 165 L 270 158 Z" fill="#FFB703" stroke="#E87A10" stroke-width="2"/>
    <!-- Beak (Lower Pouch) -->
    <path d="M 270 158 Q 320 245 385 165" fill="#FB8500" stroke="#E87A10" stroke-width="2"/>
    <!-- Beak detail line -->
    <line x1="270" y1="152" x2="395" y2="156" stroke="#E87A10" stroke-width="2"/>

    <!-- Near Leg (Right, pedaling) -->
    <path d="M 200 310 L 210 345 L 240 385" fill="none" stroke="#FF9F1C" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Webbed Foot -->
    <path d="M 230 382 Q 245 375 255 385 Q 250 398 235 395 Q 225 398 230 382" fill="#FF9F1C" stroke="#E87A10" stroke-width="2"/>

    <!-- Wing (Resting on body, reaching for handlebar) -->
    <path d="M 180 230 Q 220 220 250 250 Q 270 280 230 300 Q 170 310 160 260 Z" fill="#E9ECEF" stroke="#DEE2E6" stroke-width="3"/>
    <!-- Wingtip "Hand" holding handlebar -->
    <path d="M 320 215 Q 335 200 350 212" fill="none" stroke="#F8F9FA" stroke-width="12" stroke-linecap="round"/>
    <path d="M 320 215 Q 335 200 350 212" fill="none" stroke="#DEE2E6" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- BASKET & FISH -->
  <g filter="url(#shadow)">
    <!-- Basket -->
    <path d="M 330 260 L 320 310 L 370 310 L 360 260 Z" fill="#D4A373" stroke="#A97142" stroke-width="3"/>
    <!-- Basket Weave Details -->
    <line x1="325" y1="280" x2="365" y2="280" stroke="#A97142" stroke-width="2"/>
    <line x1="323" y1="295" x2="367" y2="295" stroke="#A97142" stroke-width="2"/>
    <line x1="335" y1="260" x2="330" y2="310" stroke="#A97142" stroke-width="1.5"/>
    <line x1="345" y1="260" x2="345" y2="310" stroke="#A97142" stroke-width="1.5"/>
    <line x1="355" y1="260" x2="360" y2="310" stroke="#A97142" stroke-width="1.5"/>
    
    <!-- Little Blue Fish peeking out -->
    <g transform="translate(335, 265) rotate(-10)">
      <path d="M 0 10 Q 15 0 30 10 Q 15 20 0 10 M 30 10 L 38 5 L 38 15 Z" fill="#4CC9F0" stroke="#333" stroke-width="1.5"/>
      <circle cx="8" cy="8" r="1.5" fill="#333"/>
    </g>
  </g>
</svg>