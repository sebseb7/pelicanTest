<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <style>
    * { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background & Environment -->
  <rect width="400" height="400" fill="#e0f2fe" />
  <!-- Clouds -->
  <g transform="translate(40, 40)" opacity="0.9">
    <ellipse cx="0" cy="0" rx="30" ry="15" fill="white" />
    <ellipse cx="20" cy="-10" rx="25" ry="12" fill="white" />
    <ellipse cx="35" cy="0" rx="20" ry="10" fill="white" />
  </g>
  <g transform="translate(280, 70)" opacity="0.7">
    <ellipse cx="0" cy="0" rx="25" ry="12" fill="white" />
    <ellipse cx="18" cy="-8" rx="20" ry="10" fill="white" />
    <ellipse cx="30" cy="0" rx="15" ry="8" fill="white" />
  </g>
  <!-- Grass -->
  <rect x="0" y="350" width="400" height="50" fill="#bbf7d0" />
  <!-- Subtle shadow -->
  <ellipse cx="190" cy="345" rx="80" ry="8" fill="#000000" opacity="0.1" />

  <!-- Bicycle -->
  <!-- Wheels -->
  <circle cx="110" cy="290" r="55" fill="none" stroke="#334155" stroke-width="4" />
  <circle cx="290" cy="290" r="55" fill="none" stroke="#334155" stroke-width="4" />
  <!-- Rear wheel spokes -->
  <line x1="55" y1="290" x2="165" y2="290" stroke="#334155" stroke-width="1.5" />
  <line x1="110" y1="235" x2="110" y2="345" stroke="#334155" stroke-width="1.5" />
  <line x1="71" y1="251" x2="149" y2="329" stroke="#334155" stroke-width="1.5" />
  <line x1="71" y1="329" x2="149" y2="251" stroke="#334155" stroke-width="1.5" />
  <!-- Front wheel spokes -->
  <line x1="235" y1="290" x2="345" y2="290" stroke="#334155" stroke-width="1.5" />
  <line x1="290" y1="235" x2="290" y2="345" stroke="#334155" stroke-width="1.5" />
  <line x1="251" y1="251" x2="329" y2="329" stroke="#334155" stroke-width="1.5" />
  <line x1="251" y1="329" x2="329" y2="251" stroke="#334155" stroke-width="1.5" />
  <!-- Wheel highlights -->
  <circle cx="90" cy="265" r="4" fill="white" opacity="0.6" />
  <circle cx="270" cy="265" r="4" fill="white" opacity="0.6" />
  <!-- Frame -->
  <line x1="110" y1="290" x2="120" y2="190" stroke="#0d9488" stroke-width="6" /> <!-- Seat stays -->
  <line x1="110" y1="290" x2="190" y2="290" stroke="#0d9488" stroke-width="6" /> <!-- Chain stays -->
  <line x1="120" y1="190" x2="190" y2="290" stroke="#0d9488" stroke-width="6" /> <!-- Seat tube -->
  <line x1="190" y1="290" x2="260" y2="170" stroke="#0d9488" stroke-width="6" /> <!-- Down tube -->
  <line x1="120" y1="190" x2="260" y2="170" stroke="#0d9488" stroke-width="6" /> <!-- Top tube -->
  <line x1="260" y1="170" x2="280" y2="190" stroke="#0d9488" stroke-width="6" /> <!-- Head tube -->
  <line x1="280" y1="190" x2="290" y2="290" stroke="#0d9488" stroke-width="6" /> <!-- Fork -->
  <!-- Seat -->
  <rect x="105" y="186" width="30" height="8" rx="4" fill="#475569" />
  <!-- Handlebars -->
  <path d="M252 165 Q260 155 268 165" fill="none" stroke="#475569" stroke-width="5" />
  <circle cx="260" cy="160" r="3" fill="#facc15" stroke="#334155" stroke-width="1" /> <!-- Bell -->
  <!-- Drivetrain -->
  <circle cx="190" cy="290" r="10" fill="none" stroke="#475569" stroke-width="2" /> <!-- Chainring -->
  <line x1="190" y1="290" x2="175" y2="315" stroke="#475569" stroke-width="3" /> <!-- Left crank -->
  <line x1="190" y1="290" x2="205" y2="265" stroke="#475569" stroke-width="3" /> <!-- Right crank -->
  <rect x="170" y="312" width="10" height="6" rx="2" fill="#475569" /> <!-- Left pedal -->
  <rect x="200" y="262" width="10" height="6" rx="2" fill="#475569" /> <!-- Right pedal -->

  <!-- Pelican -->
  <g id="pelican">
    <!-- Body -->
    <ellipse cx="120" cy="150" rx="30" ry="40" fill="#f1f5f9" />
    <!-- Head -->
    <circle cx="140" cy="100" r="22" fill="#f1f5f9" />
    <!-- Upper beak -->
    <path d="M160 95 L220 90 L210 100 L160 105 Z" fill="#facc15" />
    <!-- Lower beak + iconic pouch -->
    <path d="M160 105 L210 110 Q225 140 210 160 Q195 170 160 110 Z" fill="#fbbf24" />
    <!-- Eyes -->
    <circle cx="147" cy="95" r="4" fill="white" />
    <circle cx="157" cy="95" r="4" fill="white" />
    <circle cx="149" cy="95" r="2" fill="black" />
    <circle cx="159" cy="95" r="2" fill="black" />
    <circle cx="150" cy="94" r="0.7" fill="white" /> <!-- Highlight -->
    <circle cx="160" cy="94" r="0.7" fill="white" /> <!-- Highlight -->
    <!-- Smile -->
    <path d="M152 107 Q157 113 162 107" fill="none" stroke="#94a3b8" stroke-width="1.5" />
    <!-- Wing (out for balance) -->
    <path d="M100 150 Q80 170 85 190 Q95 200 110 180 Z" fill="#e2e8f0" />
    <!-- Head tuft -->
    <path d="M130 80 Q125 70 135 75 Q140 65 145 78" fill="#f1f5f9" />
    <!-- Hands on handlebars -->
    <ellipse cx="255" cy="168" rx="5" ry="4" fill="#f1f5f9" />
    <ellipse cx="268" cy="168" rx="5" ry="4" fill="#f1f5f9" />
    <!-- Webbed feet -->
    <g transform="translate(175, 315)">
      <ellipse rx="7" ry="3" fill="#facc15" />
      <path d="M-7 0 L0 -4 L7 0" fill="none" stroke="#facc15" stroke-width="1.5" /> <!-- Toes -->
    </g>
    <g transform="translate(205, 265)">
      <ellipse rx="7" ry="3" fill="#facc15" />
      <path d="M-7 0 L0 -4 L7 0" fill="none" stroke="#facc15" stroke-width="1.5" /> <!-- Toes -->
    </g>
  </g>
</svg>