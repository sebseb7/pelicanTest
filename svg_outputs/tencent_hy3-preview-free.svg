<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Sky background -->
  <rect width="400" height="300" fill="#87CEEB"/>
  
  <!-- Ground -->
  <rect y="250" width="400" height="50" fill="#90EE90"/>
  
  <!-- Bicycle -->
  <g transform="translate(100, 200)">
    <!-- Rear wheel -->
    <circle cx="0" cy="0" r="30" fill="none" stroke="#333" stroke-width="4"/>
    <circle cx="0" cy="0" r="5" fill="#333"/>
    
    <!-- Front wheel -->
    <circle cx="100" cy="0" r="30" fill="none" stroke="#333" stroke-width="4"/>
    <circle cx="100" cy="0" r="5" fill="#333"/>
    
    <!-- Frame -->
    <path d="M 0,0 L 40,-40 L 80,-40 L 100,0" fill="none" stroke="#8B4513" stroke-width="4"/>
    <line x1="0" y1="0" x2="80" y2="-40" stroke="#8B4513" stroke-width="4"/>
    <line x1="40" y1="-40" x2="100" y2="0" stroke="#8B4513" stroke-width="4"/>
    
    <!-- Seat -->
    <ellipse cx="50" cy="-45" rx="10" ry="5" fill="#654321"/>
    
    <!-- Handlebars -->
    <line x1="90" y1="-35" x2="110" y2="-35" stroke="#333" stroke-width="3"/>
    <line x1="100" y1="-35" x2="100" y2="-25" stroke="#333" stroke-width="3"/>
    
    <!-- Pedals -->
    <circle cx="50" cy="-15" r="8" fill="#666"/>
    <line x1="50" y1="-15" x2="40" y2="-5" stroke="#333" stroke-width="2"/>
    <line x1="50" y1="-15" x2="60" y2="-5" stroke="#333" stroke-width="2"/>
  </g>
  
  <!-- Pelican -->
  <g transform="translate(150, 155)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="25" ry="15" fill="#F5F5DC"/>
    
    <!-- Head -->
    <circle cx="20" cy="-20" r="12" fill="#F5F5DC"/>
    
    <!-- Eye -->
    <circle cx="24" cy="-22" r="2" fill="#333"/>
    
    <!-- Beak -->
    <path d="M 32,-18 L 50,-15 L 32,-12 Z" fill="#FFA500"/>
    
    <!-- Wings (one extended for balance) -->
    <path d="M -10,-5 Q -25,-15 -20,-25 Q -5,-20 0,-15" fill="#E6E6FA" stroke="#C0C0C0" stroke-width="1"/>
    
    <!-- Legs (on pedals) -->
    <line x1="-5" y1="10" x2="-5" y2="25" stroke="#FFA500" stroke-width="3"/>
    <line x1="5" y1="10" x2="5" y2="25" stroke="#FFA500" stroke-width="3"/>
    <!-- Feet on pedals -->
    <ellipse cx="-5" cy="25" rx="4" ry="2" fill="#FFA500"/>
    <ellipse cx="5" cy="25" rx="4" ry="2" fill="#FFA500"/>
  </g>
  
  <!-- Sun -->
  <circle cx="350" cy="50" r="25" fill="#FFD700"/>
  <g stroke="#FFD700" stroke-width="2">
    <line x1="350" y1="20" x2="350" y2="5"/>
    <line x1="350" y1="80" x2="350" y2="95"/>
    <line x1="320" y1="50" x2="305" y2="50"/>
    <line x1="380" y1="50" x2="395" y2="50"/>
    <line x1="330" y1="30" x2="320" y2="20"/>
    <line x1="370" y1="70" x2="380" y2="80"/>
    <line x1="330" y1="70" x2="320" y2="80"/>
    <line x1="370" y1="30" x2="380" y2="20"/>
  </g>
  
  <!-- Clouds -->
  <circle cx="80" cy="60" r="15" fill="white"/>
  <circle cx="100" cy="50" r="20" fill="white"/>
  <circle cx="120" cy="60" r="15" fill="white"/>
  
  <circle cx="250" cy="80" r="15" fill="white"/>
  <circle cx="270" cy="70" r="20" fill="white"/>
  <circle cx="290" cy="80" r="15" fill="white"/>
</svg>