<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- Soft sky background -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6f7ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <!-- Gradient for the iconic pelican pouch -->
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb74d"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
  </defs>

  <!-- Background & Ground -->
  <rect width="400" height="300" fill="url(#sky)"/>
  <path d="M 0,265 L 400,265" stroke="#cfd8dc" stroke-width="2"/>

  <!-- ===== BICYCLE ===== -->
  <g id="bicycle" stroke="#37474f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wheels -->
    <circle cx="100" cy="220" r="45" fill="#ffffff" stroke-width="5"/>
    <circle cx="280" cy="220" r="45" fill="#ffffff" stroke-width="5"/>
    
    <!-- Spokes -->
    <g stroke="#b0bec5" stroke-width="1.5">
      <path d="M100,175 L100,265 M55,220 L145,220 M68,188 L132,252 M68,252 L132,188"/>
      <path d="M280,175 L280,265 M235,220 L325,220 M248,188 L312,252 M248,252 L312,188"/>
    </g>
    
    <!-- Hubs -->
    <circle cx="100" cy="220" r="4" fill="#37474f" stroke="none"/>
    <circle cx="280" cy="220" r="4" fill="#37474f" stroke="none"/>

    <!-- Frame (filled white first so legs don't show through weirdly, then red outlines) -->
    <path d="M 100,220 L 155,145 L 180,220 Z M 155,145 L 245,145 L 260,185 L 180,220 Z" fill="#ffffff" stroke="none"/>
    <path d="M 100,220 L 155,145 L 180,220 M 155,145 L 245,145 L 260,185 L 180,220" stroke="#e53935" stroke-width="5"/>
    
    <!-- Front Fork -->
    <path d="M 260,185 L 280,220" stroke="#37474f" stroke-width="5"/>
    
    <!-- Seat post & Saddle -->
    <path d="M 155,145 L 152,135" stroke="#37474f" stroke-width="4"/>
    <path d="M 140,133 Q 152,128 166,133 Q 155,140 140,133 Z" fill="#263238" stroke="none"/>

    <!-- Handlebar, Grip & Bell -->
    <path d="M 245,145 L 238,122 L 218,122" stroke="#37474f" stroke-width="4"/>
    <path d="M 218,122 Q 210,122 210,130" stroke="#263238" stroke-width="5"/>
    <circle cx="235" cy="118" r="4" fill="#ffd54f" stroke="#f57f17" stroke-width="1"/>

    <!-- Crank & Pedals -->
    <circle cx="180" cy="220" r="9" fill="#37474f" stroke="none"/>
    <path d="M 180,220 L 195,238" stroke="#37474f" stroke-width="4"/> <!-- Near crank -->
    <path d="M 180,220 L 165,202" stroke="#78909c" stroke-width="4"/> <!-- Far crank -->
    <rect x="188" y="238" width="14" height="4" rx="1" fill="#263238" stroke="none"/>
    <rect x="158" y="200" width="14" height="4" rx="1" fill="#263238" stroke="none"/>
  </g>

  <!-- ===== PELICAN ===== -->
  <g id="pelican">
    <!-- Far Leg (Darker orange to imply depth, resting on the far pedal) -->
    <path d="M 145,125 L 152,165 L 165,202" fill="none" stroke="#d84315" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 160,201 L 174,200 L 167,207 Z" fill="#f57c00" stroke="#d84315" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Tail feathers -->
    <path d="M 115,105 L 85,95 L 92,115 L 80,120 L 112,125 Z" fill="#eceff1" stroke="#b0bec5" stroke-width="2" stroke-linejoin="round"/>

    <!-- Body (Sitting right on the saddle) -->
    <ellipse cx="145" cy="105" rx="48" ry="32" transform="rotate(-12 145 105)" fill="#ffffff" stroke="#cfd8dc" stroke-width="2"/>

    <!-- S-Curved Neck (Drawn twice for a clean outline) -->
    <path d="M 175,95 C 198,88 192,62 210,52" fill="none" stroke="#cfd8dc" stroke-width="22" stroke-linecap="round"/>
    <path d="M 175,95 C 198,88 192,62 210,52" fill="none" stroke="#ffffff" stroke-width="19" stroke-linecap="round"/>

    <!-- Head -->
    <ellipse cx="212" cy="50" rx="17" ry="15" transform="rotate(10 212 50)" fill="#ffffff" stroke="#cfd8dc" stroke-width="2"/>

    <!-- Big ol' Throat Pouch -->
    <path d="M 224,54 C 238,88 268,82 278,50 C 255,64 240,62 224,54 Z" fill="url(#pouch)" stroke="#e65100" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Long Upper Beak -->
    <path d="M 224,48 L 278,50 L 226,55 Z" fill="#ffe082" stroke="#f57f17" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 226,55 L 278,50" stroke="#e65100" stroke-width="1.5"/> <!-- Beak separation line -->
    <circle cx="234" cy="50" r="1.2" fill="#e65100"/> <!-- Nostril -->

    <!-- Eye & Brow -->
    <circle cx="216" cy="44" r="3.5" fill="#263238"/>
    <circle cx="217" cy="43" r="1.2" fill="#ffffff"/>
    <path d="M 210,38 Q 216,36 221,39" fill="none" stroke="#b0bec5" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Near Leg (Brighter, resting on the near pedal) -->
    <path d="M 160,128 L 178,180 L 195,238" fill="none" stroke="#ff9800" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 190,237 L 206,236 L 198,244 Z" fill="#ffb74d" stroke="#e65100" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Folded Back Wing -->
    <path d="M 130,90 Q 155,82 172,100 Q 155,118 128,110 Z" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="2"/>
    <path d="M 185,106 Q 198,112 208,124 M 175,108 Q 190,114 202,126" fill="none" stroke="#e0e0e0" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Front Wing Reaching for the Handlebar -->
    <path d="M 165,95 Q 195,98 214,120 Q 218,128 210,130 Q 202,130 198,122 Q 180,112 158,110 Z" fill="#ffffff" stroke="#cfd8dc" stroke-width="2" stroke-linejoin="round"/>
    <!-- Little wing-tip "hand" gripping the bar -->
    <path d="M 210,124 Q 216,124 214,130 Q 210,132 208,128 Z" fill="#ffb74d" stroke="#e65100" stroke-width="1.5"/>

    <!-- Cyclist Cap (Matches the bike frame!) -->
    <path d="M 198,38 Q 212,28 226,38 Q 212,34 198,38 Z" fill="#e53935" stroke="#b71c1c" stroke-width="1.5"/>
    <path d="M 224,38 L 234,36 Q 230,40 224,39 Z" fill="#b71c1c"/>
  </g>
  
  <!-- Speed / Motion lines -->
  <g stroke="#90caf9" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <path d="M 30,150 L 60,150"/>
    <path d="M 20,170 L 45,170"/>
    <path d="M 35,190 L 55,190"/>
  </g>
</svg>